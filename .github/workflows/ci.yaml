name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install
      - run: npx c8 --reporter lcovonly --reporter text npm test
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm ci
      - run: npm run prepack --workspaces --if-present

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - name: Install compatible security scanner
        # mcp-scan 0.4.3 is a rename placeholder; skill-check invokes mcp-scan.
        run: |
          uv tool install 'mcp-scan==0.4.2'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - run: npm run lint:skills -- --format github --security-scan-runner local --no-installs --security-scan-verbose
